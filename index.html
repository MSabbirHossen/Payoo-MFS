<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- daisyUI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Payoo-MFS</title>
  </head>
  <body class="bg-[#f4f5f7] h-screen">
    <form>
      <div class="flex items-center justify-center h-screen">
        <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">
          <!-- Company Logo -->
          <div class="m-8 p-6 relative">
            <img
              src="./assets/bg.png"
              alt="Company Logo"
              class="mx-auto w-40 h-40 mt-4 mb-4 absolute top-4 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
            />
            <img
              src="./assets/Group.png"
              alt="Company Logo"
              class="w-15 h-15 mx-auto mt-0 mb-4 absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
            />
          </div>

          <!-- Login Form -->
          <h2 class="text-2xl font-bold mb-6 text-center">Payoo-MFS</h2>
          <div class="mb-4">
            <label for="username" class="block text-gray-700 font-bold mb-2"
              >Mobile Number</label
            >
            <input
              type="text"
              id="username"
              name="username"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
              placeholder="Enter your mobile number"
              required
            />
          </div>
          <div class="mb-6">
            <label for="password" class="block text-gray-700 font-bold mb-2"
              >Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
              placeholder="Enter your password"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full bg-blue-500 text-white py-2 rounded-2xl hover:bg-blue-600 transition duration-200"
          >
            Login
          </button>
        </div>
      </div>
    </form>
  </body>
</html>
